<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reader View — Text Mend</title>
    <style>
      :root { --bg:#fff; --fg:#1a1a1a; --muted:#6b7280; --accent:#1a73e8; --mark:#fff7d6; --width:42rem; --size:19px; }
      [data-theme="dark"] { --bg:#16181c; --fg:#e6e6e6; --muted:#9aa0a6; --mark:#3a3413; }
      [data-theme="sepia"] { --bg:#f4ecd8; --fg:#3a3328; --muted:#7a6f57; --mark:#e8dcae; }
      * { box-sizing: border-box; }
      body { margin:0; background:var(--bg); color:var(--fg); font:var(--size)/1.7 Georgia, serif; }
      .toolbar { position:sticky; top:0; display:flex; gap:12px; align-items:center; flex-wrap:wrap;
        padding:10px 16px; background:var(--bg); border-bottom:1px solid rgba(128,128,128,.25); font-family:system-ui; font-size:14px; }
      .toolbar button { font:13px system-ui; padding:5px 10px; border:1px solid rgba(128,128,128,.4);
        border-radius:6px; background:transparent; color:var(--fg); cursor:pointer; }
      .toolbar .spacer { flex:1; }
      main { max-width:var(--width); margin:0 auto; padding:32px 20px 96px; }
      h1 { font-size:1.9em; line-height:1.25; }
      .byline { font-family:system-ui; color:var(--muted); font-size:.8em; }
      figcaption, .caption { font-family:system-ui; color:var(--muted); font-size:.8em; font-style:italic; }
      h2,h3 { line-height:1.3; }
      mark.repaired { background:var(--mark); border-radius:3px; padding:0 2px; cursor:help; }
      .obfuscated { border-bottom:2px dotted #c0392b; }
      .notice { font-family:system-ui; font-size:.85em; padding:10px 14px; margin:0 0 20px;
        border-radius:8px; border:1px solid #e0b400; background:rgba(224,180,0,.12); color:var(--fg); }
      .meta { color:var(--muted); font-family:system-ui; font-size:.8em; }
      #empty { color:var(--muted); font-family:system-ui; }
    </style>
  </head>
  <body>
    <div class="toolbar">
      <strong style="font-family:system-ui;font-size:14px">Reader</strong>
      <span id="readtime" class="meta"></span>
      <span class="spacer"></span>
      <button id="marks" aria-pressed="true">Hide repair marks</button>
      <button id="theme">Theme</button>
      <button id="smaller" aria-label="Decrease font size">A−</button>
      <button id="larger" aria-label="Increase font size">A+</button>
      <button id="copy">Copy</button>
      <button id="copymd">Copy Markdown</button>
      <span id="status" class="meta" role="status" aria-live="polite"></span>
    </div>
    <main id="article" aria-live="polite"><p id="empty">Loading article…</p></main>
    <script type="module" src="reader-page.js"></script>
  </body>
</html>
