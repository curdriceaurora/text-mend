<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Text Mend</title>
    <style>
      body { font: 13px/1.4 system-ui, sans-serif; width: 260px; margin: 0; padding: 12px; }
      h1 { font-size: 14px; margin: 0 0 8px; }
      button { display: block; width: 100%; margin: 4px 0; padding: 7px; font-size: 13px;
        border: 1px solid #ccc; border-radius: 6px; background: #f7f7f7; cursor: pointer; }
      button:hover { background: #efefef; }
      button.primary { background: #1a73e8; color: #fff; border-color: #1a73e8; }
      #status { margin-top: 8px; padding: 6px; min-height: 16px; font-size: 12px; color: #333;
        background: #f0f4f9; border-radius: 6px; }
      .row { display: flex; gap: 4px; }
      .row button { margin: 4px 0; }
    </style>
  </head>
  <body>
    <h1>Text Mend</h1>
    <button id="reader" class="primary">Open reader view</button>
    <button id="scan">Scan page</button>
    <button id="normalize" class="primary">Normalize page</button>
    <button id="selection">Normalize selection</button>
    <div class="row">
      <button id="copy">Copy cleaned</button>
      <button id="undo">Undo</button>
    </div>
    <button id="settings">Settings</button>
    <div id="status" role="status" aria-live="polite">Ready.</div>
    <script type="module" src="popup.js"></script>
  </body>
</html>
