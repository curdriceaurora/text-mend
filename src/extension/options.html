<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Text Mend — Settings</title>
    <style>
      body { font: 14px/1.5 system-ui, sans-serif; max-width: 560px; margin: 24px auto; padding: 0 16px; }
      h1 { font-size: 18px; }
      .field { display: flex; align-items: center; justify-content: space-between; gap: 12px;
        padding: 8px 0; border-bottom: 1px solid #eee; }
      label { flex: 1; }
      input[type="number"] { width: 90px; }
      #saved { color: #137333; height: 18px; }
    </style>
  </head>
  <body>
    <h1>Settings</h1>
    <div class="field">
      <label for="autoNormalize">Auto-apply high-confidence fixes on “Normalize page”</label>
      <input type="checkbox" id="autoNormalize" checked />
    </div>
    <div class="field">
      <label for="dedupeOnCopy">Remove duplicate paragraphs when copying cleaned text</label>
      <input type="checkbox" id="dedupeOnCopy" checked />
    </div>
    <div class="field">
      <label for="threshold">Confidence threshold for auto-fix (0–1)</label>
      <input type="number" id="threshold" min="0" max="1" step="0.05" value="0.75" />
    </div>
    <div class="field">
      <label for="minLength">Minimum segment length (characters)</label>
      <input type="number" id="minLength" min="1" step="1" value="20" />
    </div>
    <div class="field">
      <label for="maxNodes">Maximum text nodes per scan</label>
      <input type="number" id="maxNodes" min="100" step="100" value="10000" />
    </div>
    <div class="field">
      <label for="rememberCorrections">Remember my corrections (local only)</label>
      <input type="checkbox" id="rememberCorrections" checked />
    </div>
    <div class="field">
      <label>Stored corrections: <span id="corrCount">0</span></label>
      <button type="button" id="clearCorr">Clear all corrections</button>
    </div>
    <p id="saved" role="status" aria-live="polite"></p>
    <script type="module" src="options.js"></script>
  </body>
</html>
